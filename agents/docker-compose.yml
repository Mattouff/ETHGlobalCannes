version: '3.8'

services:
  news-agent:
    build: ./news
    container_name: news-agent
    ports:
      - "8002:8002"
    environment:
      - NEWSAPI_KEY=${NEWSAPI_KEY}
    volumes:
      - ./news/news_logs.json:/app/news_logs.json
      - ./news/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - news-network

networks:
  news-network:
    driver: bridge